name: Build ITER APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'

      - name: Extract ITER project
        run: unzip -q ITER_Full_Android_Project.zip -d iter-source

      - name: Build debug APK
        working-directory: iter-source
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ITER-debug-APK
          path: iter-source/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
